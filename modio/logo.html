<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
      }
      body {
        background:
          radial-gradient(ellipse 70% 90% at 22% 50%, rgba(94, 234, 212, 0.13), transparent 60%),
          radial-gradient(ellipse 60% 70% at 95% 110%, rgba(251, 191, 36, 0.1), transparent 60%), #11151c;
        font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif;
        color: #e8edf3;
        position: relative;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1.5px, transparent 1.5px);
        background-size: 32px 32px;
        mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.25));
      }
      .wrap {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 56px;
        padding: 0 80px;
      }
      .icon {
        width: 250px;
        height: 250px;
        flex: none;
        filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.5));
      }
      h1 {
        margin: 0;
        font-size: 132px;
        line-height: 0.95;
        font-weight: 700;
        letter-spacing: -3px;
      }
      h1 .b {
        color: #5eead4;
      }
      .tag {
        margin-top: 28px;
        font-size: 38px;
        font-weight: 500;
        white-space: nowrap;
        color: #aab6c4;
        letter-spacing: -0.5px;
      }
      .tag strong {
        color: #e8edf3;
        font-weight: 600;
      }
      .code {
        margin-top: 40px;
        display: inline-block;
        font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
        font-size: 26px;
        white-space: nowrap;
        padding: 14px 22px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: #c9d4e0;
      }
      .k {
        color: #c4a7ff;
      }
      .f {
        color: #5eead4;
      }
      .t {
        color: #fbbf24;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="wrap">
      <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="8" width="56" height="48" rx="8" fill="#1f2530" stroke="#5eead4" stroke-width="3" />
        <path
          d="M18 24 L28 32 L18 40"
          fill="none"
          stroke="#5eead4"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path d="M32 42 H46" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
      </svg>
      <div>
        <h1>Melvor<br /><span class="b">Script</span></h1>
        <div class="tag">Play <strong>Melvor Idle</strong> by writing <strong>TypeScript</strong></div>
        <div class="code">
          <span class="k">await</span> m.skills.woodcutting.<span class="f">cut</span>(<span class="t">Trees</span>.Oak)
        </div>
      </div>
    </div>
  </body>
</html>

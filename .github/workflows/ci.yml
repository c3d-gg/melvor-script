name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4 # keep in step with local Bun: `bun fmt --check` output can change between versions
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun fmt --check
      - run: bun run pack
